# Local PostgreSQL 16 with the pgvector extension pre-installed
# (pgvector is not used yet; it is needed for the semantic-search milestone).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tank
      POSTGRES_PASSWORD: tank
      POSTGRES_DB: tankdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
